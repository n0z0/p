[package]
name = "p"
version = "0.5.0"
edition = "2021"
authors = ["Rolly Maulana Awangga <rolly@awang.ga>"]
description = "Custom Lightweight Multiplatform Remote Control Agent & Controller"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
snow = "0.9"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
sysinfo = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
rpassword = "7.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
